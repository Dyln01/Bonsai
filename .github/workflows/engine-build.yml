name: engine-build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: clone colibri @ bf24429 (pinned stock)
        run: |
          git clone --depth 100 https://github.com/JustVugg/colibri "$HOME/colibri"
          git -C "$HOME/colibri" checkout -q bf24429
          git -C "$HOME/colibri" log --oneline -1

      - name: overlay Bonsai engine snapshot
        run: |
          cp engine/qwen36.c   "$HOME/colibri/c/"
          cp engine/kv8_fused.h engine/kv_fp8.h engine/kv_tq.h "$HOME/colibri/c/"
          # stock check: our .orig must equal the pinned stock file
          cmp engine/qwen36.c.orig "$HOME/colibri/c/qwen36.c.orig" 2>/dev/null || true
          md5sum engine/qwen36.c.orig

      - name: build engine
        run: make -C "$HOME/colibri/c" qwen36 -j"$(nproc)"

      - name: synthetic student container + tokenizer (real-head for numeric gates)
        run: |
          python3 -m pip install --quiet numpy
          STUDENT_REALHEAD=1 python3 scripts/gen_student_i4.py
          python3 scripts/make_tokenizer.py "$HOME/synth_models/student_1b_i4/tokenizer.json" 2047

      - name: smoke run (prompt mode, greedy)
        run: |
          set -e
          printf 'The quick brown fox jumps over the lazy dog. ' > /tmp/p.txt
          for i in 1 2 3; do printf 'Counting numbers matter: %d. ' $i >> /tmp/p.txt; done
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 DUMP=/tmp/l_stock.bin DUMP_IDS=/tmp/ids.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run1.out 2> /tmp/run1.err
          rc=$?
          echo "rc=$rc"
          grep -q "\[prefill\] p=" /tmp/run1.err && echo "prefill progress lines present"
          grep -c "\[timers\]" /tmp/run1.err || true
          tail -5 /tmp/run1.err
          [ "$rc" -eq 0 ]

      - name: determinism gate (two fresh processes, identical tokens)
        run: |
          set -e
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 DUMP=/tmp/l_run2.bin \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run2.out 2> /dev/null
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          b=$(sha256sum /tmp/l_run2.bin | cut -d' ' -f1)
          echo "logits run1=$a run2=$b"
          [ "$a" = "$b" ]
          python3 -c "import numpy as np; x=np.fromfile('/tmp/l_stock.bin',np.float32); assert np.linalg.norm(x) > 0, 'degenerate logits'; print('logit norm OK', float(np.linalg.norm(x)))"

      - name: MTP gate 1 — knob on, headless container must refuse
        run: |
          set -e
          if SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=4 \
             COLI_TEMP=0 OMP_NUM_THREADS=2 KVSAVE=0 Q36_MTP=1 \
             timeout 300 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/mtp_refuse.err
          then echo "expected refusal, got rc=0"; exit 1; fi
          grep -q "refusing" /tmp/mtp_refuse.err && echo "refusal message OK"

      - name: MTP gate 2 — synthetic head loads, knob-off bytes unchanged
        run: |
          set -e
          python3 scripts/gen_mtp_head_synth.py "$HOME/synth_models/student_1b_i4"
          rc=0
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 Q36_MTP=1 DUMP=/tmp/l_mtp.bin \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run_mtp.out 2> /tmp/run_mtp.err || rc=$?
          echo "engine rc=$rc"
          if ! grep -q "\[qwen36 MTP\] head loaded" /tmp/run_mtp.err; then
            echo "--- engine stderr (tail):"; tail -25 /tmp/run_mtp.err; exit 1
          fi
          echo "head-loaded line OK"
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          b=$(sha256sum /tmp/l_mtp.bin | cut -d' ' -f1)
          echo "stock=$a mtp-loaded=$b"
          [ "$a" = "$b" ]   # part 1: head loads and stays inert (last-logit identity)

      - name: MTP gate 3 — drafting on (drafts 0..3), greedy output still stock-identical
        run: |
          set -e
          for D in 0 1 2 3; do
            SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
            COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
            Q36_MTP=1 Q36_MTP_DRAFTS=$D COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP=/tmp/l_d$D.bin \
            timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/mtp_d$D.out 2> /tmp/mtp_d$D.err
            a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
            b=$(sha256sum /tmp/l_d$D.bin | cut -d' ' -f1)
            echo "drafts=$D logits stock=$a run=$b"
            [ "$a" = "$b" ]
          done
          # random-weight head: ~0 acceptance, so verifies must have run and rolled back
          grep -q "\[qwen36 MTP\] run:" /tmp/mtp_d2.err
          grep -q "verifies" /tmp/mtp_d2.err
          tail -3 /tmp/mtp_d2.err

      - name: MTP gate 4 — forced-accept oracle (ref.json bootstrapped from the stock run)
        run: |
          set -e
          python3 - <<'PY'
          import json
          ids = [int(l) for l in open("/tmp/ids.txt")]
          assert len(ids) > 12
          json.dump({"prompt_ids": ids[:-12], "full_ids": ids}, open("/tmp/ref.json", "w"))
          print("ref.json: prompt", len(ids) - 12, "full", len(ids))
          PY
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          Q36_MTP=1 Q36_MTP_FORCE=accept COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP_IDS=/tmp/ids_force.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/ref.json > /tmp/force_a.out 2> /tmp/force_a.err
          grep -q "\[qwen36 MTP\] run:" /tmp/force_a.err || { tail -20 /tmp/force_a.err; exit 1; }
          grep -q "acceptance 100.0%" /tmp/force_a.err || { grep "\[qwen36 MTP\]" /tmp/force_a.err; exit 1; }
          cmp /tmp/ids.txt /tmp/ids_force.txt
          echo "forced-accept id sequence == stock (oracle reproduced exactly)"
          grep -q "Matching tokens: 12/12" /tmp/force_a.out
          grep "\[qwen36 MTP\]" /tmp/force_a.err

      - name: MTP gate 5 — forced mixed/cycle (rejections + partial accepts, sequence still exact)
        run: |
          set -e
          for F in mixed cycle; do
            SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 \
            COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
            Q36_MTP=1 Q36_MTP_FORCE=$F COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP_IDS=/tmp/ids_$F.txt \
            timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/ref.json > /dev/null 2> /tmp/force_$F.err
            cmp /tmp/ids.txt /tmp/ids_$F.txt
            echo "force=$F: id sequence == stock (verify+rollback exact under rejection)"
            grep "\[qwen36 MTP\] run:" /tmp/force_$F.err
          done

      - name: TQ absorb parity (codec 1, Q36_TQ_ABSORB 0 vs 1)
        run: |
          set -e
          for A in 0 1; do
            SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
            COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
            KV_TQ=4 KV_TQ_CODEC=1 Q36_TQ_ABSORB=$A DUMP=/tmp/l_tq$A.bin DUMP_IDS=/tmp/ids_tq$A.txt \
            timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2>&1
          done
          ls -l /tmp/l_tq0.bin /tmp/l_tq1.bin /tmp/l_stock.bin
          python3 - <<'PY'
          import numpy as np
          for f in ("/tmp/l_stock.bin", "/tmp/l_tq0.bin", "/tmp/l_tq1.bin"):
              a = np.fromfile(f, np.float32)
              print(f, "n=", a.size, "nan=", int(np.isnan(a).sum()), "norm=", float(np.linalg.norm(a)), "head=", [round(float(v),3) for v in a[:6]])
          PY
          python3 - <<'PY'
          import numpy as np
          for f in ("/tmp/l_tq0.bin", "/tmp/l_tq1.bin"):
              a = np.fromfile(f, np.float32)
              print(f, "n=", a.size, "nan=", int(np.isnan(a).sum()), "norm=", float(np.linalg.norm(a)))
          a = np.fromfile('/tmp/l_tq0.bin', np.float32); b = np.fromfile('/tmp/l_tq1.bin', np.float32)
          assert a.size and b.size and not np.isnan(a).any() and not np.isnan(b).any(), "bad dump"
          c = float(a @ b / (np.linalg.norm(a) * np.linalg.norm(b)))
          print("logit cosine", c)
          assert c > 0.99999
          PY
          cmp /tmp/ids_tq0.txt /tmp/ids_tq1.txt
          echo "absorb off/on: id sequences identical"

      - name: MoE head gates (coder30 synth, 128 experts, group-limited top-k)
        run: |
          set -e
          export SYNTH_OUT="$HOME/synth_models/synth_moe_ci" SYNTH_H=512 SYNTH_L=8 SYNTH_E=32 SYNTH_K=4 SYNTH_MLP=256
          python3 scripts/gen_coder30_synth.py
          python3 scripts/make_tokenizer.py "$SYNTH_OUT/tokenizer.json" 4095
          python3 scripts/gen_mtp_head_synth.py "$SYNTH_OUT"
          SNAP="$SYNTH_OUT" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=8 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          DUMP=/tmp/l_moestock.bin DUMP_IDS=/tmp/ids_moe.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/moe_stock.err || { echo "stock moe run failed"; tail -20 /tmp/moe_stock.err; exit 1; }
          SNAP="$SYNTH_OUT" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=8 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          Q36_MTP=1 COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP_IDS=/tmp/ids_moe_mtp.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/moe_mtp.err || { tail -20 /tmp/moe_mtp.err; exit 1; }
          grep -q "dense=0" /tmp/moe_mtp.err || { tail -20 /tmp/moe_mtp.err; exit 1; }
          cmp /tmp/ids_moe.txt /tmp/ids_moe_mtp.txt
          echo "MoE head loaded; drafting-on sequence == stock"
          python3 - <<'PY'
          import json
          ids = [int(l) for l in open("/tmp/ids_moe.txt")]
          json.dump({"prompt_ids": ids[:-8], "full_ids": ids}, open("/tmp/ref_moe.json", "w"))
          PY
          SNAP="$SYNTH_OUT" TRUNK_MAP=1 Q36_MAXT=512 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          Q36_MTP=1 Q36_MTP_FORCE=accept COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP_IDS=/tmp/ids_moe_f.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/ref_moe.json > /dev/null 2> /tmp/moe_f.err
          grep -q "acceptance 100.0%" /tmp/moe_f.err || { grep "\[qwen36 MTP\]" /tmp/moe_f.err; exit 1; }
          cmp /tmp/ids_moe.txt /tmp/ids_moe_f.txt
          echo "MoE forced-accept: sequence == stock, acceptance 100%"

      - name: shared-expert head gate (MoE + SI>0)
        run: |
          set -e
          export SYNTH_OUT="$HOME/synth_models/synth_moe_si" SYNTH_H=512 SYNTH_L=8 SYNTH_E=32 SYNTH_K=4 SYNTH_MLP=256 SYNTH_SI=128
          python3 scripts/gen_coder30_synth.py
          python3 scripts/make_tokenizer.py "$SYNTH_OUT/tokenizer.json" 4095
          python3 scripts/gen_mtp_head_synth.py "$SYNTH_OUT"
          SNAP="$SYNTH_OUT" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=8 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 DUMP_IDS=/tmp/ids_si.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/si_stock.err || { tail -20 /tmp/si_stock.err; exit 1; }
          SNAP="$SYNTH_OUT" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=8 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          Q36_MTP=1 COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP_IDS=/tmp/ids_si_mtp.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/si_mtp.err || { tail -20 /tmp/si_mtp.err; exit 1; }
          grep -q "dense=0" /tmp/si_mtp.err || { tail -20 /tmp/si_mtp.err; exit 1; }
          cmp /tmp/ids_si.txt /tmp/ids_si_mtp.txt
          echo "SI>0 MoE head: drafting-on sequence == stock"
