name: engine-build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: clone colibri @ bf24429 (pinned stock)
        run: |
          git clone --depth 100 https://github.com/JustVugg/colibri "$HOME/colibri"
          git -C "$HOME/colibri" checkout -q bf24429
          git -C "$HOME/colibri" log --oneline -1

      - name: overlay Bonsai engine snapshot
        run: |
          cp engine/qwen36.c   "$HOME/colibri/c/"
          cp engine/kv8_fused.h engine/kv_fp8.h engine/kv_tq.h "$HOME/colibri/c/"
          # stock check: our .orig must equal the pinned stock file
          cmp engine/qwen36.c.orig "$HOME/colibri/c/qwen36.c.orig" 2>/dev/null || true
          md5sum engine/qwen36.c.orig

      - name: build engine
        run: make -C "$HOME/colibri/c" qwen36 -j"$(nproc)"

      - name: synthetic student container + tokenizer
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/gen_student_i4.py
          python3 scripts/make_tokenizer.py "$HOME/synth_models/student_1b_i4/tokenizer.json" 2047

      - name: smoke run (prompt mode, greedy)
        run: |
          set -e
          printf 'The quick brown fox jumps over the lazy dog. ' > /tmp/p.txt
          for i in 1 2 3; do printf 'Counting numbers matter: %d. ' $i >> /tmp/p.txt; done
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 DUMP=/tmp/l_stock.bin DUMP_IDS=/tmp/ids.txt \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run1.out 2> /tmp/run1.err
          rc=$?
          echo "rc=$rc"
          grep -c "\[timers\]" /tmp/run1.err || true
          tail -5 /tmp/run1.err
          [ "$rc" -eq 0 ]

      - name: determinism gate (two fresh processes, identical tokens)
        run: |
          set -e
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 DUMP=/tmp/l_run2.bin \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run2.out 2> /dev/null
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          b=$(sha256sum /tmp/l_run2.bin | cut -d' ' -f1)
          echo "logits run1=$a run2=$b"
          [ "$a" = "$b" ]

      - name: MTP gate 1 — knob on, headless container must refuse
        run: |
          set -e
          if SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=4 \
             COLI_TEMP=0 OMP_NUM_THREADS=2 KVSAVE=0 Q36_MTP=1 \
             timeout 300 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/mtp_refuse.err
          then echo "expected refusal, got rc=0"; exit 1; fi
          grep -q "refusing" /tmp/mtp_refuse.err && echo "refusal message OK"

      - name: MTP gate 2 — synthetic head loads, knob-off bytes unchanged
        run: |
          set -e
          python3 scripts/gen_mtp_head_synth.py "$HOME/synth_models/student_1b_i4"
          rc=0
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 Q36_MTP=1 DUMP=/tmp/l_mtp.bin \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run_mtp.out 2> /tmp/run_mtp.err || rc=$?
          echo "engine rc=$rc"
          if ! grep -q "\[qwen36 MTP\] head loaded" /tmp/run_mtp.err; then
            echo "--- engine stderr (tail):"; tail -25 /tmp/run_mtp.err; exit 1
          fi
          echo "head-loaded line OK"
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          b=$(sha256sum /tmp/l_mtp.bin | cut -d' ' -f1)
          echo "stock=$a mtp-loaded=$b"
          [ "$a" = "$b" ]   # part 1: head loads and stays inert (last-logit identity)

      - name: MTP gate 3 — drafting on (drafts 0..3), greedy output still stock-identical
        run: |
          set -e
          for D in 0 1 2 3; do
            SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
            COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
            Q36_MTP=1 Q36_MTP_DRAFTS=$D COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP=/tmp/l_d$D.bin \
            timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/mtp_d$D.out 2> /tmp/mtp_d$D.err
            a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
            b=$(sha256sum /tmp/l_d$D.bin | cut -d' ' -f1)
            echo "drafts=$D logits stock=$a run=$b"
            [ "$a" = "$b" ]
          done
          # random-weight head: ~0 acceptance, so verifies must have run and rolled back
          grep -q "\[qwen36 MTP\] run:" /tmp/mtp_d2.err
          grep -q "verifies" /tmp/mtp_d2.err
          tail -3 /tmp/mtp_d2.err

      - name: MTP gate 4 — forced-accept oracle (ref.json bootstrapped from the stock run)
        run: |
          set -e
          python3 - <<'PY'
          import json
          ids = [int(l) for l in open("/tmp/ids.txt")]
          assert len(ids) > 12
          json.dump({"prompt_ids": ids[:-12], "full_ids": ids}, open("/tmp/ref.json", "w"))
          print("ref.json: prompt", len(ids) - 12, "full", len(ids))
          PY
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          Q36_MTP=1 Q36_MTP_FORCE=accept COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP=/tmp/l_force_a.bin \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/ref.json > /dev/null 2> /tmp/force_a.err
          grep -q "\[qwen36 MTP\] run:" /tmp/force_a.err || { tail -20 /tmp/force_a.err; exit 1; }
          grep -q "acceptance 100.0%" /tmp/force_a.err || { grep "\[qwen36 MTP\]" /tmp/force_a.err; exit 1; }
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          b=$(sha256sum /tmp/l_force_a.bin | cut -d' ' -f1)
          echo "stock=$a forced-accept=$b"
          [ "$a" = "$b" ]
          grep "\[qwen36 MTP\]" /tmp/force_a.err

      - name: MTP gate 5 — forced mixed/cycle (rejections + partial accepts, logits still exact)
        run: |
          set -e
          a=$(sha256sum /tmp/l_stock.bin | cut -d' ' -f1)
          for F in mixed cycle; do
            SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 \
            COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
            Q36_MTP=1 Q36_MTP_FORCE=$F COLI_LOOKUP=0 COLI_SPEC_GATE=0 DUMP=/tmp/l_force_$F.bin \
            timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/ref.json > /dev/null 2> /tmp/force_$F.err
            b=$(sha256sum /tmp/l_force_$F.bin | cut -d' ' -f1)
            echo "force=$F stock=$a run=$b"
            [ "$a" = "$b" ]
            grep "\[qwen36 MTP\] run:" /tmp/force_$F.err
          done
