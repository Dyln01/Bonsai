name: engine-build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: clone colibri @ bf24429 (pinned stock)
        run: |
          git clone --depth 100 https://github.com/JustVugg/colibri "$HOME/colibri"
          git -C "$HOME/colibri" checkout -q bf24429
          git -C "$HOME/colibri" log --oneline -1

      - name: overlay Bonsai engine snapshot
        run: |
          cp engine/qwen36.c   "$HOME/colibri/c/"
          cp engine/kv8_fused.h engine/kv_fp8.h engine/kv_tq.h "$HOME/colibri/c/"
          # stock check: our .orig must equal the pinned stock file
          cmp engine/qwen36.c.orig "$HOME/colibri/c/qwen36.c.orig" 2>/dev/null || true
          md5sum engine/qwen36.c.orig

      - name: build engine
        run: make -C "$HOME/colibri/c" qwen36 -j"$(nproc)"

      - name: synthetic student container + tokenizer
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/gen_student_i4.py
          python3 scripts/make_tokenizer.py "$HOME/synth_models/student_1b_i4/tokenizer.json" 2047

      - name: smoke run (prompt mode, greedy)
        run: |
          set -e
          printf 'The quick brown fox jumps over the lazy dog. ' > /tmp/p.txt
          for i in 1 2 3; do printf 'Counting numbers matter: %d. ' $i >> /tmp/p.txt; done
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run1.out 2> /tmp/run1.err
          rc=$?
          echo "rc=$rc"
          grep -c "\[timers\]" /tmp/run1.err || true
          tail -5 /tmp/run1.err
          [ "$rc" -eq 0 ]

      - name: determinism gate (two fresh processes, identical tokens)
        run: |
          set -e
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run2.out 2> /dev/null
          a=$(sha256sum /tmp/run1.out | cut -d' ' -f1)
          b=$(sha256sum /tmp/run2.out | cut -d' ' -f1)
          echo "run1=$a run2=$b"
          [ "$a" = "$b" ]

      - name: MTP gate 1 — knob on, headless container must refuse
        run: |
          set -e
          if SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=4 \
             COLI_TEMP=0 OMP_NUM_THREADS=2 KVSAVE=0 Q36_MTP=1 \
             timeout 300 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /dev/null 2> /tmp/mtp_refuse.err
          then echo "expected refusal, got rc=0"; exit 1; fi
          grep -q "refusing" /tmp/mtp_refuse.err && echo "refusal message OK"

      - name: MTP gate 2 — synthetic head loads, knob-off bytes unchanged
        run: |
          set -e
          python3 scripts/gen_mtp_head_synth.py "$HOME/synth_models/student_1b_i4"
          SNAP="$HOME/synth_models/student_1b_i4" TRUNK_MAP=1 Q36_MAXT=512 N_NEW=12 \
          COLI_TEMP=0 OMP_NUM_THREADS=2 COLI_NO_OMP_TUNE=1 KVSAVE=0 Q36_MTP=1 \
          timeout 900 "$HOME/colibri/c/qwen36" 8 2 /tmp/p.txt > /tmp/run_mtp.out 2> /tmp/run_mtp.err
          grep -q "\[qwen36 MTP\] head loaded" /tmp/run_mtp.err && echo "head-loaded line OK"
          a=$(sha256sum /tmp/run1.out | cut -d' ' -f1)
          b=$(sha256sum /tmp/run_mtp.out | cut -d' ' -f1)
          echo "stock=$a mtp-loaded=$b"
          [ "$a" = "$b" ]   # part 1: head loads and stays inert
