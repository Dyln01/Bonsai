name: gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: parity gates (hermetic — kv_fp8.h vendored in engine/)
        run: |
          set -e
          gcc -O2 -Iengine -o /tmp/kv8p engine/kv8_parity.c -lm && /tmp/kv8p
          gcc -O2 -Iengine -o /tmp/tqp engine/kv_tq_parity_q36.c -lm && /tmp/tqp
          gcc -O2 -mavx2 -mfma -Iengine -o /tmp/smb engine/softmaxbench_q36.c -lm && /tmp/smb

      - name: TQ absorbed-rotation parity (C gate)
        run: |
          set -e
          gcc -O2 -Iengine -o /tmp/absorb engine/tq_absorb_parity.c -lm && /tmp/absorb

      - name: engine snapshot verifier
        run: bash tools/verify_engine.sh

      - name: results JSON parse
        run: |
          for f in results/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
          echo "results/*.json all parse"

      - name: python syntax (tools + scripts)
        run: python3 -m py_compile tools/*.py scripts/*.py

      - name: runner env-name oracle (E11 — decoy alias / missing TRUNK_MAP detection)
        run: python3 scripts/check_runner_env.py

      - name: hot_sort / st_dump container gates (fixtures)
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/test_hot_sort.py

      - name: make_synthetic_model self-check
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/make_synthetic_model.py

      - name: iothrottle shim build + bandwidth smoke
        run: |
          set -e
          gcc -O2 -shared -fPIC scripts/iothrottle.c -o /tmp/iothrottle.so -ldl -lpthread
          mkdir -p /tmp/ioth_dir
          head -c 48m /dev/zero > /tmp/ioth_dir/data.bin
          # Read with dd (an explicit read() loop), NOT `cat`: coreutils turns
          # `cat file > /dev/null` into copy_file_range, a kernel-side copy that never
          # enters the interposed read/pread hooks -- this gate then measures a
          # pass-through and fails on a runner-image bump (48 MB "read" in 5 ms), which
          # is exactly what happened on the runner image that forced Node 24.
          t0=$(date +%s%N)
          IOTH_DIR=/tmp/ioth_dir IOTH_BW_MBPS=150 IOTH_STATS=1 LD_PRELOAD=/tmp/iothrottle.so \
            dd if=/tmp/ioth_dir/data.bin of=/dev/null bs=1M 2>/tmp/ioth_dd.err
          ms=$(( ($(date +%s%N) - t0) / 1000000 ))
          # Deterministic half of the gate: the shim must ACCOUNT for the bytes. A timing
          # bound alone cannot tell "throttled" from "never intercepted".
          grep -E "\[ioth\] intercepted" /tmp/ioth_dd.err || true
          by=$(grep -oE "intercepted [0-9]+ bytes" /tmp/ioth_dd.err | grep -oE "[0-9]+" | tail -1)
          echo "throttled read took ${ms}ms, shim accounted ${by:-0} bytes (expect >= ~320ms / 48 MB)"
          if [ -n "$by" ] && [ "$by" -ge 46000000 ]; then :; else
            echo "FAIL: the shim did not account for the read — it was never intercepted"
            exit 1
          fi
          [ "$ms" -ge 250 ]

